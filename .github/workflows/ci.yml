name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up mise tools
        uses: jdx/mise-action@v4
        with:
          version: "2026.10.1"
          install_args: "node@24.19.0 pnpm@11.8.0"

      - name: Verify toolchain
        run: |
          mise --version
          test "$(mise exec -- node --version)" = "v24.19.0"
          test "$(mise exec -- pnpm --version)" = "11.8.0"
          python3 --version

      - name: Install dependencies
        timeout-minutes: 5
        run: mise exec -- pnpm install --frozen-lockfile

      - name: Run aggregate gate
        timeout-minutes: 5
        run: mise run --output prefix --timeout 2m ci
