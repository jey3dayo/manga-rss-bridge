name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up mise tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: "2026.10.1"
          install_args: "node@24.19.0 pnpm@11.8.0"

      - name: Verify toolchain
        run: |
          mise --version
          test "$(mise exec -- node --version)" = "v24.19.0"
          test "$(mise exec -- pnpm --version)" = "11.8.0"

      - name: Install dependencies
        timeout-minutes: 5
        run: mise exec -- pnpm install --frozen-lockfile

      - name: Run aggregate gate
        timeout-minutes: 5
        run: mise run --output prefix --timeout 2m ci
